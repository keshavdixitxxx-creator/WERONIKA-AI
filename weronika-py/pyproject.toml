[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weronika-local-messaging"
version = "0.1.0"
description = "Local, confirmation-first messaging automation for Weronika AI"
requires-python = ">=3.10"
dependencies = ["playwright>=1.50,<2"]

[project.scripts]
weronika-messaging = "weronika_agent.http_server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["weronika_agent*"]
